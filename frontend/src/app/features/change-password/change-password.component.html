<div class="change-password-page">
  <form class="change-password-card card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Set a new password</h1>
    <p class="hint">You must set your own password before continuing.</p>

    <div class="field">
      <label class="field-label" for="currentPassword">Current (one-time) password</label>
      <input
        id="currentPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label class="field-label" for="newPassword">New password</label>
      <input
        id="newPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label class="field-label" for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <button
      type="button"
      class="toggle-visibility"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="passwordVisible() ? 'Hide passwords' : 'Show passwords'"
    >
      @if (passwordVisible()) {
        <span aria-hidden="true">&#128584;</span> Hide passwords
      } @else {
        <span aria-hidden="true">&#128065;</span> Show passwords
      }
    </button>

    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.dirty) {
      <p class="banner-error" role="alert">Passwords do not match.</p>
    }

    @if (errorMessage()) {
      <p class="banner-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn-primary submit-btn" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Saving…' : 'Save new password' }}
    </button>
  </form>
</div>
