<div class="change-password-page">
  <form class="change-password-card card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Set a new password</h1>
    <p class="hint">You must set your own password before continuing.</p>

    <div class="field">
      <label class="field-label" for="currentPassword">Current (one-time) password</label>
      <input
        id="currentPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />
    </div>

    <div class="field">
      <label class="field-label" for="newPassword">New password</label>
      <input
        id="newPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label class="field-label" for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        class="input-field"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
    </div>

    <button
      type="button"
      class="toggle-visibility"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="passwordVisible() ? 'Hide passwords' : 'Show passwords'"
    >
      @if (passwordVisible()) {
        <app-icon name="eye-off" [size]="18" /> Hide passwords
      } @else {
        <app-icon name="eye" [size]="18" /> Show passwords
      }
    </button>

    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.dirty) {
      <div class="banner-error" role="alert">
        <app-icon name="alert-triangle" [size]="16" />
        <span>Passwords do not match.</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="banner-error" role="alert">
        <app-icon name="alert-triangle" [size]="16" />
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <button type="submit" class="btn-primary submit-btn" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Saving…' : 'Save new password' }}
    </button>
  </form>
</div>
