<div class="change-password-page">
  <form class="change-password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Set a new password</h1>
    <p class="hint">You must set your own password before continuing.</p>

    <label for="currentPassword">Current (one-time) password</label>
    <input
      id="currentPassword"
      [type]="passwordVisible() ? 'text' : 'password'"
      formControlName="currentPassword"
      autocomplete="current-password"
    />

    <label for="newPassword">New password</label>
    <input
      id="newPassword"
      [type]="passwordVisible() ? 'text' : 'password'"
      formControlName="newPassword"
      autocomplete="new-password"
    />

    <label for="confirmPassword">Confirm new password</label>
    <input
      id="confirmPassword"
      [type]="passwordVisible() ? 'text' : 'password'"
      formControlName="confirmPassword"
      autocomplete="new-password"
    />

    <button
      type="button"
      class="toggle-visibility"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="passwordVisible() ? 'Hide passwords' : 'Show passwords'"
    >
      {{ passwordVisible() ? 'Hide passwords' : 'Show passwords' }}
    </button>

    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.dirty) {
      <p class="error" role="alert">Passwords do not match.</p>
    }

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Saving…' : 'Save new password' }}
    </button>
  </form>
</div>
