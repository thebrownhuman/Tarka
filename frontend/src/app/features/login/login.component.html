<div class="login-page">
  <form class="login-card card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to access Tarka.</p>

    <div class="field">
      <label class="field-label" for="loginId">Login ID</label>
      <input id="loginId" class="input-field" type="text" formControlName="loginId" autocomplete="username" />
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <div class="password-field">
        <input
          id="password"
          class="input-field"
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        >
          @if (passwordVisible()) {
            <span aria-hidden="true">&#128584;</span>
          } @else {
            <span aria-hidden="true">&#128065;</span>
          }
        </button>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="banner-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn-primary submit-btn" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
