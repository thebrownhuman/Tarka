<div class="login-page">
  <form class="login-card card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand-mark">
      <span class="brand-mark-icon"><app-icon name="brand" [size]="18" /></span>
      Tarka
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to access Tarka.</p>

    <div class="field">
      <label class="field-label" for="loginId">Login ID</label>
      <input id="loginId" class="input-field" type="text" formControlName="loginId" autocomplete="username" />
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <div class="password-field">
        <input
          id="password"
          class="input-field"
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        >
          @if (passwordVisible()) {
            <app-icon name="eye-off" [size]="18" />
          } @else {
            <app-icon name="eye" [size]="18" />
          }
        </button>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="banner-error" role="alert">
        <app-icon name="alert-triangle" [size]="16" />
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <button type="submit" class="btn-primary submit-btn" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
